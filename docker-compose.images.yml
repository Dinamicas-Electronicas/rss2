# Override para desplegar las imagenes publicadas en GHCR por
# .github/workflows/images.yml, en vez de construir en el host.
#
# Uso recomendado (etiqueta inmutable por commit):
#   RSS2_TAG=sha-752ad1e ./scripts/deploy-images.sh
#
# O a mano:
#   docker compose -f docker-compose.yml -f docker-compose.images.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.images.yml up -d --no-build
#
# `pull_policy: always` garantiza que cada `up` use la imagen del registro y no
# una copia local antigua. El `build:` del compose base se conserva para el
# flujo local; con `--no-build` no se usa.

services:
  backend:
    image: ${RSS2_REGISTRY:-ghcr.io/dinamicas-electronicas}/rss2-backend:${RSS2_TAG:-latest}
    pull_policy: always

  wiki:
    image: ${RSS2_REGISTRY:-ghcr.io/dinamicas-electronicas}/rss2-backend:${RSS2_TAG:-latest}
    pull_policy: always

