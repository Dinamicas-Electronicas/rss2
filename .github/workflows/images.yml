# Construye y publica las imagenes del stack en GitHub Container Registry.
#
# Se llama desde ci.yml despues de que pasen los tests (workflow_call) o a
# mano desde la pestana Actions (workflow_dispatch). En el modo manual se puede
# activar `build_heavy` para construir tambien TTS: pesa ~4,8 GB y el runner
# estandar de GitHub tiene ~14 GB de disco, asi que se libera espacio antes.
# NER (~4,6 GB) sí se construye siempre: es un servicio del stack por defecto.

name: Images

on:
  workflow_call:
    inputs:
      build_heavy:
        description: "Construir tambien TTS (~4,8 GB)"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      build_heavy:
        description: "Construir tambien TTS (~4,8 GB)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # Imagenes ligeras: se publican en cada push a master y en cada tag v*.
  light:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: Dockerfile
          - name: frontend
            context: ./frontend
            dockerfile: Dockerfile
          - name: ingestor
            context: ./rss-ingestor-go
            dockerfile: Dockerfile
          - name: pyworkers
            context: .
            dockerfile: Dockerfile.scheduler
          - name: translator
            context: ./translator
            dockerfile: Dockerfile.cpu
          - name: translator-gpu
            context: ./translator
            dockerfile: Dockerfile.gpu
          - name: embeddings
            context: .
            dockerfile: Dockerfile.embeddings
          - name: ner
            context: .
            dockerfile: Dockerfile.ner
    steps:
      - uses: actions/checkout@v4

      # NER pesa ~4,6 GB: libera el disco que trae el runner de serie.
      - name: Liberar disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      # GHCR exige nombres en minusculas: Dinamicas-Electronicas no vale.
      - name: Propietario en minusculas
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/rss2-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref_name == 'master' || github.ref_name == 'main' }}
            type=ref,event=tag
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          # Refresca las imagenes base (parches de seguridad) en cada build.
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=rss2-${{ matrix.name }}
          cache-to: type=gha,mode=min,scope=rss2-${{ matrix.name }}
          provenance: true
          sbom: true

  # TTS: solo con build_heavy=true (manual). NER va en `light` porque es un
  # servicio del stack por defecto.
  heavy:
    name: ${{ matrix.name }}
    if: ${{ inputs.build_heavy }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tts
            context: .
            dockerfile: Dockerfile.tts
    steps:
      - uses: actions/checkout@v4

      # El runner estandar se queda corto para esta imagen.
      - name: Liberar disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - name: Propietario en minusculas
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/rss2-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref_name == 'master' || github.ref_name == 'main' }}
            type=ref,event=tag
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
