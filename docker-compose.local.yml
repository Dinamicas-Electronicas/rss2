# Override local: permite acceder a Grafana en http://localhost:3001
#
# En el compose principal los servicios de monitorización no publican puertos
# (solo hablan por la red interna). Este override añade el mapeo en loopback.
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml \
#     --profile monitoring up -d
services:
  grafana:
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - backend
      - frontend
